<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AEGIS · Evidence search</title><link rel="stylesheet" href="/style.css"><style>
main{max-width:1000px;margin:auto;padding:40px 24px}body{display:block}h1{font-size:28px;margin:24px 0 8px}p{color:#a8a6a2}form{display:flex;gap:10px;flex-wrap:wrap;margin:28px 0}input,select{background:#242423;color:#eee;border:1px solid #3c3c39;border-radius:6px;padding:10px;font:inherit}#query{flex:1;min-width:180px}article{border:1px solid #343431;border-radius:8px;padding:20px;margin:14px 0}article p{white-space:pre-wrap;color:#d1cfca;line-height:1.6}small{color:#a8a6a2}details pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}a{color:#c6c4bf}.head{display:flex;justify-content:space-between;align-items:center;gap:20px}#status{min-height:24px}
</style></head><body><main><div class="head"><a href="/">← Documents</a><button id="index" class="subtle">Refresh index</button></div><h1>Find evidence.</h1><p>Keyword search · BM25 · local documents</p><small id="stats">Loading index…</small><form id="search"><input id="query" placeholder="e.g. requirements verification" aria-label="Search evidence" required maxlength="2000"><select id="format" aria-label="Document format"><option value="">All formats</option><option value="pdf">PDF</option><option value="docx">DOCX</option></select><select id="mode" aria-label="Term matching"><option value="any">Any term</option><option value="all">All terms</option></select><button class="primary">Search</button></form><div id="status" role="status"></div><section id="results" aria-label="Ranked evidence"></section><small>Refresh after new uploads. Lower BM25 scores rank higher. Scores are not confidence probabilities.</small></main><script>
const $=id=>document.getElementById(id);let token;
async function api(path,options){const response=await fetch(path,options);const data=await response.json();if(!response.ok)throw Error(data.error||'Request failed');return data;}
function item(tag,text){const element=document.createElement(tag);element.textContent=text;return element;}
async function stats(){const data=await api('/api/retrieval');$('stats').textContent=`${data.documents} indexed documents · ${data.chunks} chunks`;}
$('index').onclick=async()=>{const button=$('index');button.disabled=true;$('status').textContent='Indexing ready documents…';try{const data=await api('/api/retrieval/index',{method:'POST',headers:{'X-Aegis-Token':token}});await stats();$('results').replaceChildren();$('status').textContent=`Updated ${data.updated_documents} documents.`;}catch(error){$('status').textContent=error.message;}finally{button.disabled=false;}};
$('search').onsubmit=async event=>{event.preventDefault();$('status').textContent='Searching…';$('results').replaceChildren();try{const started=performance.now();const params=new URLSearchParams({q:$('query').value,mode:$('mode').value,format:$('format').value});const data=await api('/api/search?'+params);$('status').textContent=`${data.results.length} results · ${Math.round(performance.now()-started)} ms`;for(const [rank,result] of data.results.entries()){const card=item('article','');const link=item('a',`${rank+1}. ${result.name}`);link.href='/?'+new URLSearchParams({document:result.job_id,page:result.pages[0]||1});card.append(link,item('p',result.chunk.text),item('small',`${result.pages.length?'Page '+result.pages.join(', '):'DOCX structure'} · ${result.kind} · score ${result.score.toPrecision(5)}`));const details=item('details','');details.append(item('summary','Source mappings'),item('pre',JSON.stringify({chunk_id:result.chunk_id,mappings:result.chunk.mappings},null,2)));card.append(details);$('results').append(card);}}catch(error){$('status').textContent=error.message;}};
(async()=>{try{token=(await api('/api/session')).token;await stats();}catch(error){$('status').textContent=error.message;}})();
</script></body></html>
